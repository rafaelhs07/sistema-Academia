name: Verificaciones
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: academia_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: academia_test_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U academia_test -d academia_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://academia_test:local-test-only@localhost:5432/academia_test_ci
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-only-publishable
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      ENABLE_BILLING_CRON: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navegador
          path: |
            playwright-report
            test-results
          retention-days: 7
